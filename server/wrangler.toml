name = "onlyheads-board"
main = "worker.js"
compatibility_date = "2025-01-01"

# Create the namespace once:
#   npx wrangler kv namespace create BOARD
# then paste the id below and deploy:
#   npx wrangler deploy
[[kv_namespaces]]
binding = "BOARD"
id = "REPLACE_WITH_YOUR_KV_ID"

[vars]
# Lock this to your site so other pages cannot post scores.
ALLOWED_ORIGIN = "https://jason10191019999.github.io"
